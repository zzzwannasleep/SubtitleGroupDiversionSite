name: subtitle-group-diversion-site

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    image: ${BACKEND_IMAGE:-zzzwannasleep111/subtitlegroupdiversionsite:latest}
    pull_policy: ${IMAGE_PULL_POLICY:-always}
    restart: unless-stopped
    env_file:
      - ./.env
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS},127.0.0.1,localhost
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://redis:6379/0
      WEBSEED_LIBRARY_ROOT: ${WEBSEED_LIBRARY_ROOT:-/app/webseed-library}
      WEBSEED_LIBRARY_URL_PATH: ${WEBSEED_LIBRARY_URL_PATH:-/webseed/}
    ports:
      - "${HTTP_PORT:-80}:8000"
    volumes:
      - ${MEDIA_VOLUME_SPEC:-torrent_storage:/app/media}
      - ${WEBSEED_LIBRARY_VOLUME_SPEC:-webseed_library:/app/webseed-library}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app_net
    logging: *default-logging

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    env_file:
      - ./.env
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - app_net
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - app_net
    logging: *default-logging

  tracker:
    image: ${TRACKER_IMAGE:-torrust/tracker:develop}
    profiles: ["tracker"]
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TORRUST_TRACKER_CONFIG_TOML_PATH: /etc/torrust/tracker/tracker.toml
      TORRUST_TRACKER_CONFIG_OVERRIDE_HTTP_API__ACCESS_TOKENS__ADMIN: ${TORRUST_API_TOKEN}
    volumes:
      - ./tracker/tracker.toml:/etc/torrust/tracker/tracker.toml:ro
      - tracker_storage:/var/lib/torrust/tracker
    ports:
      - "${TRACKER_HTTP_PORT:-7070}:7070"
      - "${TRACKER_UDP_PORT:-6969}:6969/udp"
      - "127.0.0.1:${TRACKER_API_PORT:-1212}:1212"
    networks:
      - app_net
    logging: *default-logging

networks:
  app_net:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  torrent_storage:
  webseed_library:
  tracker_storage:
